# scenario A modified class version: decay only, capX=595, Planck + SPT-3G D1 (lite)

likelihood:
  # --- SPT-3G D1 T&E, lite variant ---
  candl_like:
    additional_args: {}
    clear_internal_priors: true
    data_set_file: !!python/name:spt_candl_data.SPT3G_D1_TnE ''
    external: !!python/name:candl.interface.CandlCobayaLikelihood ''
    variant: "lite"
    feedback: true
    wrapper: null
    type: SPT

  # --- Planck 2018 ---
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  # ONE high-l likelihood only. Your old file had both highl_plik.TT and
  # highl_plik.TTTEEE, which counts the TT data twice.
  # Option 1 (fast, no Planck nuisance parameters): plik-lite
  planck_2018_highl_plik.TTTEEE_lite_native: null
  # Option 2 (full plik, adds ~20 nuisance params): use this instead of the line above
  # planck_2018_highl_plik.TTTEEE: null
  # CMB lensing: commented out, as your old comment said you intended
  planck_2018_lensing.clik: null

theory:
  classy:
    path: 'global'
    ignore_obsolete: True
    extra_args:
      nonlinear_min_k_max: 25
      N_ncdm: 1
      m_ncdm: 0.000001     # was missing; without it CLASS uses its default ncdm mass
      #scenario A is 1, for B it is 0
      N_ur: 2.044
      # for scenario A this is 2.044- for B it is 3.044
      capX: 595
      nu_decay: 'no'
      nu_scattering: 'no'
      delmsq: 0.000075
      nu_scattering_rate_dir: '/srv/scratch/z5257894/SPT_inclcobaya/scratch_spt_decay/lib/python3.11/site-packages/class_NuDecayScattering'

output: /srv/scratch/z5257894/SPT_inclcobaya/Streamlined_flow/595A_plancksptLITE_mpitest2/

params:
  capY:
    latex: Y
    prior:
      min: 0
      max: 100000
    # ref: 36000 - but try  it with a smaller reference point to see if this changes things for decay. will be starting at same point for all chains
    ref: {dist: norm, loc: 1000, scale: 100}
    proposal: 100
  Tcal:
    latex: T_{\rm cal}
    prior:
      max: 1.2
      min: 0.8
    ref: 1.0
  Ecal:
    latex: E_{\rm cal}
    prior:
      max: 1.2
      min: 0.8
    ref: 1.0
  theta_s_100:
    prior:
      min: 0.5
      max: 10
    ref:
      dist: norm
      loc: 1.0416
      scale: 0.0004
    proposal: 0.0002
    latex: 100\theta_\mathrm{s}
  logA:
    drop: true
    latex: \log(10^{10} A_\mathrm{s})
    prior:
      max: 5.0
      min: 1.0
    ref: 3.0563293664848805
  n_s:
    latex: n_\mathrm{s}
    prior:
      max: 2.0
      min: 0.2
    ref: 0.948760147539579
  omega_b:
    prior:
      max: 0.1
      min: 0.0
    ref: 0.022205552241797096
    latex: \Omega_\mathrm{b} h^2
  omega_cdm:
    prior:
      max: 0.99
      min: 0.0
    ref: 0.12215852992670449
    latex: \Omega_\mathrm{c} h^2
  H0:
    latex: H_0
  A:
    derived: 'lambda A_s: 1e9*A_s'
    latex: 10^9 A_\mathrm{s}
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  age:
    latex: '{\rm{Age}}/\mathrm{Gyr}'
  clamp:
    derived: 'lambda A_s, tau_reio: 1e9*A_s*np.exp(-2*tau_reio)'
    latex: 10^9 A_\mathrm{s} e^{-2\tau}
  Omega_Lambda:
    latex: \Omega_\Lambda
  Omega_m:
    latex: \Omega_\mathrm{m}
  omegamh2:
    derived: 'lambda Omega_m, H0: Omega_m*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  rs_drag:
    latex: r_\mathrm{drag}
  s8h5:
    derived: 'lambda sigma8, H0: sigma8*(H0*1e-2)**(-0.5)'
    latex: \sigma_8/h^{0.5}
  s8omegamp25:
    derived: 'lambda sigma8, Omega_m: sigma8*Omega_m**0.25'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.25}
  s8omegamp5:
    derived: 'lambda sigma8, Omega_m: sigma8*Omega_m**0.5'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.5}
  sigma8:
    latex: \sigma_8
  tau_reio:
    prior:
      min: 0.01
      max: 0.8
    ref:
      dist: norm
      loc: 0.055
      scale: 0.006
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  z_reio:
    latex: z_\mathrm{re}

prior:
  gaussian_Tcal: 'lambda Tcal: stats.norm.logpdf(Tcal, loc=1.0,
    scale=0.0036)'

resume: true

sampler:
  mcmc:
    Rminus1_cl_stop: 0.2
    Rminus1_stop: 0.01
    covmat: /srv/scratch/z5257894/SPT_inclcobaya/github_ver/spt_candl_data/cobaya/SPT3G_D1_TnE/input_ttteee_class.covmat
    drag: true
    learn_proposal_Rminus1_max: 30
    learn_proposal_Rminus1_max_early: 100
    output_every: 50
    oversample_power: 0.4
    proposal_scale: 1.9

timing: true     # uncomment once to see whether CLASS or the likelihoods dominate
debug: true